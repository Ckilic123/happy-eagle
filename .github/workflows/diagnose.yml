name: Diagnose images

# Read-only. Prints what the wardrobe images actually contain (sizes, EXIF
# orientation flags) so orientation bugs can be diagnosed from facts rather
# than from what a photo happens to look like in one particular viewer.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pillow supabase

      - name: Inspect images
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/diagnose_images.py
